name: CI
on:
  push:
    branches: [feat/dtf-report-worker]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
        if: always()
      - run: npm test
        if: always()
